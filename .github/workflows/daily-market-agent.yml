name: Daily Market Agent

on:
  push:
    branches:
      - main
  schedule:
    # 12:30 UTC is 8:30 AM Eastern during daylight saving time.
    # 19:30 UTC is 3:30 PM Eastern during daylight saving time.
    # These become 7:30 AM / 2:30 PM Eastern during standard time.
    # Adjust if you want exact wall-clock local times year round.
    - cron: "30 12 * * 1-5"
    - cron: "30 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report, dashboard, and Discord alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          WATCHLIST_JSON: ${{ secrets.WATCHLIST_JSON }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dashboard.html
        run: python -m src.main

      - name: Persist learning history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals_history.json data/paper_trades.json
          git diff --cached --quiet || git commit -m "Update signal learning history [skip ci]"
          git push

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
