portfolio_path: data/portfolio.json
watchlist_path: data/watchlist.json
output_dir: output
dashboard_path: output/dashboard.html
report_path: output/latest_report.json
public_output_dir: public
public_dashboard_path: public/dashboard.html
public_report_path: public/latest_report.json

dashboard:
  title: Kevin Stock Research Agent
  # GitHub Actions also sets DASHBOARD_URL dynamically; this is used for local runs.
  url: "https://kevintaylormccaffrey-debug.github.io/AI-Trader/dashboard.html"

market_data:
  timeout_seconds: 12
  price_provider: stooq
  history_days: 90
  user_agent: KevinStockResearchAgent/0.1
  sector_proxy_map:
    semiconductors: SMH
    ai: QQQ
    automation: IGV
    datacenter: XLK
    high-growth tech: QQQ
    index fund: VTI
    software: IGV

news:
  lookback_days: 7
  max_items_per_ticker: 5
  timeout_seconds: 12
  sources:
    - yahoo
    - google

openai:
  gpt_enabled: true
  rules_only_mode: false
  model: gpt-5-nano
  chat_model: gpt-5-nano
  api_url: https://api.openai.com/v1/responses
  max_gpt_calls_per_day: 8
  max_articles_per_run: 16
  max_events_per_call: 4
  max_tokens_per_call: 900
  chat_max_tokens_per_call: 700
  max_daily_gpt_budget_estimate: 0.25
  estimated_input_cost_per_1m_tokens: 0.05
  estimated_output_cost_per_1m_tokens: 0.40
  relevance_threshold: 45
  price_move_threshold_pct: 5
  unusual_volume_ratio: 2.0
  important_classifications:
    - risk elevated
    - research opportunity
    - sell watch

discovery:
  max_ideas: 5
  minimum_price: 5
  excluded_labels:
    - penny stock
    - meme stock
    - biotech lottery ticket

scoring:
  weights:
    price_momentum: 0.18
    news_sentiment: 0.18
    downside_from_cost_basis: 0.20
    earnings_proximity: 0.10
    sector_trend: 0.14
    thesis_risk: 0.12
    valuation_caution: 0.08
  add_watch_threshold: 64
  sell_watch_threshold: 35
  elevated_risk_threshold: 45

alerts:
  discord_enabled: true
  max_discord_chars: 1900
  timezone: America/New_York

history:
  signals_history_path: data/signals_history.json
  paper_trades_path: data/paper_trades.json
  signal_accuracy_path: output/signal_accuracy.json
  learning_mode: observe_only
  review_after_days: 14
  evaluation_days: 14
